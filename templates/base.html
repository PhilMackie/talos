<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>{% block title %}Talos{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="forge-embers" aria-hidden="true">
    <span class="particle ember" style="left:10.8%; width:9px; height:9px; animation-duration:14.4s; animation-delay:3.9s; --d1:-14px; --d2:-16px; --d3:21px; --d4:12px; --r1:-48deg; --r2:38deg; --r3:-62deg; --r4:-63deg;"></span>
    <span class="particle ember" style="left:21.2%; width:4px; height:4px; animation-duration:12.1s; animation-delay:0.4s; --d1:-10px; --d2:19px; --d3:22px; --d4:12px; --r1:37deg; --r2:-14deg; --r3:44deg; --r4:1deg;"></span>
    <span class="particle ember" style="left:73.6%; width:4px; height:4px; animation-duration:8.6s; animation-delay:6.8s; --d1:-5px; --d2:-13px; --d3:-9px; --d4:-1px; --r1:-44deg; --r2:-47deg; --r3:27deg; --r4:-46deg;"></span>
    <span class="particle ember" style="left:82.2%; width:6px; height:6px; animation-duration:13.0s; animation-delay:12.9s; --d1:7px; --d2:12px; --d3:-15px; --d4:2px; --r1:-50deg; --r2:5deg; --r3:22deg; --r4:-21deg;"></span>
    <span class="particle ember" style="left:6.7%; width:9px; height:9px; animation-duration:13.6s; animation-delay:12.4s; --d1:-17px; --d2:-8px; --d3:-16px; --d4:2px; --r1:1deg; --r2:46deg; --r3:23deg; --r4:-29deg;"></span>
    <span class="particle ember" style="left:34.5%; width:6px; height:6px; animation-duration:13.7s; animation-delay:11.2s; --d1:21px; --d2:19px; --d3:-18px; --d4:16px; --r1:-27deg; --r2:66deg; --r3:-8deg; --r4:-29deg;"></span>
    <span class="particle ember" style="left:36.8%; width:7px; height:7px; animation-duration:16.9s; animation-delay:10.2s; --d1:13px; --d2:-8px; --d3:21px; --d4:-2px; --r1:-56deg; --r2:-12deg; --r3:-62deg; --r4:10deg;"></span>
    <span class="particle ember" style="left:26.0%; width:7px; height:7px; animation-duration:9.1s; animation-delay:15.1s; --d1:-2px; --d2:-9px; --d3:19px; --d4:9px; --r1:31deg; --r2:47deg; --r3:-34deg; --r4:-3deg;"></span>
    <span class="particle ember" style="left:23.9%; width:5px; height:5px; animation-duration:12.6s; animation-delay:4.2s; --d1:15px; --d2:5px; --d3:15px; --d4:3px; --r1:22deg; --r2:-14deg; --r3:-35deg; --r4:60deg;"></span>
    <span class="particle ember" style="left:8.8%; width:7px; height:7px; animation-duration:7.5s; animation-delay:1.8s; --d1:18px; --d2:-12px; --d3:21px; --d4:5px; --r1:-54deg; --r2:28deg; --r3:27deg; --r4:49deg;"></span>
    <span class="particle ember" style="left:24.4%; width:8px; height:8px; animation-duration:12.5s; animation-delay:15.1s; --d1:21px; --d2:-15px; --d3:21px; --d4:12px; --r1:-2deg; --r2:17deg; --r3:-42deg; --r4:5deg;"></span>
    <span class="particle ember" style="left:15.3%; width:7px; height:7px; animation-duration:7.0s; animation-delay:11.6s; --d1:-6px; --d2:10px; --d3:-11px; --d4:10px; --r1:-43deg; --r2:6deg; --r3:59deg; --r4:-20deg;"></span>
    <span class="particle ember" style="left:36.3%; width:5px; height:5px; animation-duration:8.6s; animation-delay:15.3s; --d1:11px; --d2:-22px; --d3:16px; --d4:-2px; --r1:55deg; --r2:-66deg; --r3:-42deg; --r4:22deg;"></span>
    <span class="particle ember" style="left:23.2%; width:6px; height:6px; animation-duration:9.4s; animation-delay:9.1s; --d1:-17px; --d2:-17px; --d3:9px; --d4:-18px; --r1:66deg; --r2:-38deg; --r3:-38deg; --r4:51deg;"></span>
    <span class="particle ember" style="left:16.0%; width:8px; height:8px; animation-duration:12.3s; animation-delay:9.7s; --d1:-9px; --d2:12px; --d3:22px; --d4:-10px; --r1:9deg; --r2:32deg; --r3:25deg; --r4:42deg;"></span>
    <span class="particle ember" style="left:43.8%; width:8px; height:8px; animation-duration:9.5s; animation-delay:1.0s; --d1:-21px; --d2:15px; --d3:13px; --d4:-8px; --r1:-14deg; --r2:-69deg; --r3:-52deg; --r4:-55deg;"></span>
    <span class="particle ember" style="left:6.5%; width:5px; height:5px; animation-duration:7.3s; animation-delay:5.3s; --d1:10px; --d2:-7px; --d3:-5px; --d4:20px; --r1:54deg; --r2:-16deg; --r3:68deg; --r4:-37deg;"></span>
    <span class="particle ember" style="left:90.7%; width:9px; height:9px; animation-duration:12.7s; animation-delay:7.6s; --d1:8px; --d2:4px; --d3:-10px; --d4:-16px; --r1:-46deg; --r2:40deg; --r3:20deg; --r4:38deg;"></span>
    <span class="particle smoke" style="left:45.3%; width:20px; height:20px; animation-duration:28.2s; animation-delay:13.5s; --d1:11px; --d2:-24px; --d3:-27px; --d4:-5px; --r1:-2deg; --r2:-32deg; --r3:-14deg; --r4:-21deg;"></span>
    <span class="particle smoke" style="left:52.0%; width:17px; height:17px; animation-duration:20.0s; animation-delay:3.7s; --d1:-1px; --d2:-15px; --d3:25px; --d4:29px; --r1:-36deg; --r2:11deg; --r3:25deg; --r4:-33deg;"></span>
    <span class="particle smoke" style="left:63.3%; width:14px; height:14px; animation-duration:25.6s; animation-delay:0.3s; --d1:-25px; --d2:29px; --d3:18px; --d4:24px; --r1:-15deg; --r2:-24deg; --r3:7deg; --r4:17deg;"></span>
    <span class="particle smoke" style="left:20.7%; width:21px; height:21px; animation-duration:23.6s; animation-delay:1.2s; --d1:-6px; --d2:-30px; --d3:-6px; --d4:-14px; --r1:13deg; --r2:-9deg; --r3:9deg; --r4:44deg;"></span>
    <span class="particle smoke" style="left:64.2%; width:22px; height:22px; animation-duration:24.8s; animation-delay:3.8s; --d1:-17px; --d2:-27px; --d3:7px; --d4:17px; --r1:24deg; --r2:-38deg; --r3:-5deg; --r4:-38deg;"></span>
    <span class="particle smoke" style="left:56.7%; width:14px; height:14px; animation-duration:25.0s; animation-delay:17.1s; --d1:-20px; --d2:-27px; --d3:2px; --d4:-25px; --r1:-22deg; --r2:-37deg; --r3:31deg; --r4:-37deg;"></span>
    <span class="particle smoke" style="left:83.6%; width:24px; height:24px; animation-duration:23.7s; animation-delay:18.8s; --d1:6px; --d2:-15px; --d3:7px; --d4:8px; --r1:-40deg; --r2:34deg; --r3:-35deg; --r4:8deg;"></span>
    <span class="particle smoke" style="left:56.6%; width:24px; height:24px; animation-duration:25.3s; animation-delay:18.7s; --d1:-17px; --d2:12px; --d3:15px; --d4:-10px; --r1:-15deg; --r2:-12deg; --r3:5deg; --r4:-29deg;"></span>
    <span class="particle smoke" style="left:62.6%; width:24px; height:24px; animation-duration:24.4s; animation-delay:18.6s; --d1:29px; --d2:-26px; --d3:-30px; --d4:-1px; --r1:34deg; --r2:27deg; --r3:-33deg; --r4:-36deg;"></span>
  </div>
  <header class="topbar">
    <a href="{{ url_for('index') }}" class="brand">
      <img src="{{ url_for('static', filename='icons/icon-192.png') }}" alt="">
      <span>TALOS</span>
    </a>
  </header>
  {% set streak_color = 'gold' if streak_count >= streak_goal else 'orange' %}
  <div class="streak-indicator" title="This week: {{ streak_count }}/{{ streak_goal }} (min {{ streak_minimum }})">
    {% for i in range(4) %}
    <span class="streak-square{% if i < streak_count %} filled {{ streak_color }}{% endif %}"></span>
    {% endfor %}
  </div>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
